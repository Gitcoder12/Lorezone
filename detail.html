<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LoreZone Detail: Full information, characters, recommendations, progress tracking.">
  <title>Detail — LoreZone</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── Hero Banner ── */
    .detail-hero {
      position: relative; min-height: 440px;
      display: flex; align-items: flex-end;
      overflow: hidden;
    }
    .detail-hero-bg {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      filter: blur(16px) brightness(0.4);
      transform: scale(1.05);
    }
    .detail-hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, var(--bg) 25%, transparent 100%);
    }
    .detail-hero-content {
      position: relative; z-index: 2;
      max-width: 1400px; width: 100%; margin: 0 auto;
      padding: 2rem 2rem 3.5rem;
      display: flex; gap: 3rem; align-items: flex-end;
    }
    .detail-poster {
      width: 220px; flex-shrink: 0;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      border: 3px solid rgba(255,255,255,0.1);
      aspect-ratio: 2/3;
      object-fit: cover;
    }
    .detail-info { flex: 1; }
    .detail-type-badge {
      display: inline-block; margin-bottom: 1rem;
      padding: 0.4rem 1rem; border-radius: 50px;
      font-size: 0.8rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: 2px;
    }
    .detail-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(1.8rem, 4vw, 3.2rem);
      line-height: 1.1; margin-bottom: 0.9rem;
      letter-spacing: -0.5px;
    }
    .detail-meta-row {
      display: flex; gap: 1.5rem; flex-wrap: wrap;
      align-items: center; margin-bottom: 1.2rem;
      color: var(--text2); font-size: 0.95rem;
    }
    .detail-meta-row .dot { color: var(--text3); opacity: 0.5; }
    .detail-rating {
      font-size: 1.4rem; font-weight: 800;
      color: var(--gold); display: flex; align-items: center; gap: 0.4rem;
    }
    .detail-actions { display: flex; gap: 0.9rem; flex-wrap: wrap; margin-top: 1.5rem; }
    .detail-warnings {
      display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 1rem;
    }
    .warning-badge {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.4rem 0.8rem; border-radius: 50px;
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
      border: 1px solid;
    }

    /* ── Main Content ── */
    .detail-layout {
      max-width: 1400px; margin: 0 auto;
      padding: 3rem 2rem;
      display: grid; grid-template-columns: 1fr 340px; gap: 3rem;
    }

    .detail-section { margin-bottom: 3rem; }
    .detail-section-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.1rem; color: var(--text2);
      text-transform: uppercase; letter-spacing: 2px;
      margin-bottom: 1.2rem;
      padding-bottom: 0.7rem;
      border-bottom: 2px solid var(--border);
    }

    .synopsis-text {
      font-size: 1rem; line-height: 1.9;
      color: var(--text2); font-weight: 400;
    }

    /* ── Genre Tags ── */
    .genre-list { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 0.75rem; }

    /* ── Characters ── */
    .characters-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 1.2rem; margin-top: 1rem;
    }
    .char-card {
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.2rem 0.8rem;
      transition: all var(--transition);
    }
    .char-card:hover { border-color: var(--accent); transform: translateY(-4px); box-shadow: var(--glow); }
    .char-card img {
      width: 80px; height: 80px; border-radius: 50%;
      object-fit: cover; border: 2px solid var(--border);
      margin-bottom: 0.8rem;
    }
    .char-name { font-weight: 800; font-size: 0.85rem; color: var(--text); }
    .char-role { font-size: 0.75rem; color: var(--text3); margin-top: 0.3rem; }

    /* ── Progress Tracker ── */
    .tracker-box {
      background: linear-gradient(135deg, var(--surface), var(--bg3));
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
    }
    .tracker-input-row {
      display: flex; gap: 0.9rem; align-items: center;
      margin-top: 1.2rem;
    }
    .tracker-input {
      background: var(--bg3); border: 1px solid var(--border);
      color: var(--text); font-family: inherit;
      font-size: 1rem; padding: 0.5rem 0.9rem;
      border-radius: var(--radius); width: 90px;
      outline: none;
      transition: all var(--transition);
    }
    .tracker-input:focus { border-color: var(--accent); box-shadow: var(--glow); }
    .tracker-label { color: var(--text2); font-size: 0.9rem; font-weight: 600; }

    /* ── Info Sidebar ── */
    .info-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .info-row {
      display: flex; justify-content: space-between;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    .info-row:last-child { border-bottom: none; }
    .info-key { color: var(--text3); font-weight: 700; }
    .info-val { color: var(--text); font-weight: 800; text-align: right; }

    /* ── Related ── */
    .related-list { display: flex; flex-direction: column; gap: 0.9rem; }
    .related-item {
      display: flex; gap: 0.9rem; align-items: center;
      padding: 0.9rem;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer; text-decoration: none;
      transition: all var(--transition);
    }
    .related-item:hover { border-color: var(--accent); box-shadow: var(--glow); }
    .related-item img {
      width: 50px; height: 75px; border-radius: 4px; object-fit: cover; flex-shrink: 0;
    }
    .related-item .ri-title { font-weight: 800; font-size: 0.9rem; color: var(--text); }
    .related-item .ri-meta { font-size: 0.75rem; color: var(--text3); margin-top: 0.2rem; }

    /* ── Trailer ── */
    .trailer-wrap {
      position: relative; padding-top: 56.25%;
      border-radius: var(--radius-lg); overflow: hidden;
      background: var(--bg3);
      border: 1px solid var(--border);
      margin-top: 1rem;
    }
    .trailer-wrap iframe {
      position: absolute; inset: 0;
      width: 100%; height: 100%; border: none;
    }
    .trailer-placeholder {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 0.8rem; color: var(--text3);
    }
    .trailer-placeholder .big { font-size: 3rem; }

    /* ── Back button ── */
    .back-btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      color: var(--text3); text-decoration: none;
      font-size: 0.9rem; font-weight: 700; letter-spacing: 1px;
      margin: 1.5rem 2rem 0;
      transition: all var(--transition);
      text-transform: uppercase;
    }
    .back-btn:hover { color: var(--accent); }

    .demographic-badge {
      display: inline-block; padding: 0.3rem 0.8rem;
      background: var(--purple); color: white;
      border-radius: 50px; font-size: 0.75rem;
      font-weight: 700; text-transform: uppercase;
      margin-top: 0.75rem;
    }

    @media (max-width: 900px) {
      .detail-layout { grid-template-columns: 1fr; }
      .detail-hero-content { flex-direction: column; align-items: flex-start; }
      .detail-poster { width: 160px; }
    }
  </style>
</head>
<body>

<div id="navbar-mount"></div>
<a href="javascript:history.back()" class="back-btn">← Back</a>

<div id="detail-root"></div>
<div id="footer-mount"></div>

<script src="app.js"></script>
<script>
  document.getElementById('navbar-mount').innerHTML = buildNavbar('');
  document.getElementById('footer-mount').innerHTML = buildFooter();

  const params = new URLSearchParams(location.search);
  const itemId = parseInt(params.get('id'));
  const item = LOREZONE_DB.find(i => i.id === itemId);

  if (!item) {
    document.getElementById('detail-root').innerHTML = `
      <div style="text-align:center;padding:5rem 2rem;color:var(--text3)">
        <div style="font-size:3.5rem;margin-bottom:1rem">🔍</div>
        <p style="font-size:1.1rem;margin-bottom:1.5rem">Title not found</p>
        <a href="index.html" class="btn btn-primary">← Back to Home</a>
      </div>`;
  } else {
    document.title = `${item.title} — LoreZone`;
    renderDetail(item);
  }

  function renderDetail(item) {
    const inWatchlist = Watchlist.has(item.id);
    const prog = Progress.get(item.id);
    const total = getTotal(item);
    const totalLabel = getTotalLabel(item);
    const related = getRecommendations(item.id, 5);

    let trailerId = null;
    if (item.trailer) {
      const m = item.trailer.match(/[?&]v=([^&]+)/) || item.trailer.match(/youtu\.be\/([^?]+)/);
      if (m) trailerId = m[1];
    }

    const infoRows = [];
    if (item.year) infoRows.push(['Year', item.year]);
    if (item.demographic) infoRows.push(['Demo', item.demographic]);
    if (item.status) infoRows.push(['Status', item.status]);
    if (item.episodes) infoRows.push(['Episodes', item.episodes]);
    if (item.seasons) infoRows.push(['Seasons', item.seasons]);
    if (item.volumes) infoRows.push(['Volumes', item.volumes]);
    if (item.chapters) infoRows.push(['Chapters', item.chapters]);
    if (item.issues) infoRows.push(['Issues', item.issues]);
    if (item.pages) infoRows.push(['Pages', item.pages]);
    if (item.runtime) infoRows.push(['Runtime', `${item.runtime} min`]);
    if (item.author) infoRows.push(['Author', item.author]);
    if (item.director) infoRows.push(['Director', item.director]);
    if (item.studios?.length) infoRows.push(['Studio', item.studios.join(', ')]);
    if (item.studio) infoRows.push(['Studio', item.studio]);
    if (item.publisher) infoRows.push(['Publisher', item.publisher]);
    if (item.series) infoRows.push(['Series', item.series]);
    if (item.franchise) infoRows.push(['Franchise', item.franchise]);

    const pct = total > 1 ? Math.min(100, (prog.current / total) * 100) : 0;

    let warningsHTML = '';
    if (item.warnings && item.warnings.length > 0) {
      warningsHTML = `<div class="detail-warnings">${item.warnings.map(w => {
        const warn = ContentWarnings[w];
        return `<span class="warning-badge" style="border-color:${warn.color};color:${warn.color}">${warn.icon} ${warn.label}</span>`;
      }).join('')}</div>`;
    }

    document.getElementById('detail-root').innerHTML = `
      <!-- Hero Banner -->
      <div class="detail-hero">
        <div class="detail-hero-bg" style="background-image:url('${item.image}')"></div>
        <div class="detail-hero-overlay"></div>
        <div class="detail-hero-content">
          <img class="detail-poster" src="${item.image}" alt="${item.title}" onerror="this.src='https://placehold.co/220x330/111118/e63946?text=No+Image'">
          <div class="detail-info">
            <span class="detail-type-badge card-badge ${getBadgeClass(item.type)}">${item.type}</span>
            <h1 class="detail-title">${item.title}</h1>
            <div class="detail-meta-row">
              <span class="detail-rating">★ ${item.rating}</span>
              <span class="dot">·</span>
              <span>${item.year}</span>
              ${totalLabel ? `<span class="dot">·</span><span>${totalLabel}</span>` : ''}
              <span class="dot">·</span>
              <span style="color:${item.status==='Ongoing'||item.status==='Publishing'?'var(--accent)':'var(--text2)'}">${item.status}</span>
            </div>
            ${item.demographic ? `<span class="demographic-badge">${item.demographic}</span>` : ''}
            <div class="genre-list">
              ${(item.genres||[]).map(g=>`<span class="tag">${g}</span>`).join('')}
            </div>
            ${warningsHTML}
            <div class="detail-actions">
              <button id="wl-btn" class="btn ${inWatchlist?'btn-primary':'btn-ghost'}" onclick="doWatchlist()">
                ${inWatchlist ? '♥ In My List' : '♡ Add to List'}
              </button>
              ${item.trailer ? `<a href="${item.trailer}" target="_blank" class="btn btn-ghost">▶ Trailer</a>` : ''}
              <a href="browse.html" class="btn btn-ghost">← Browse</a>
            </div>
          </div>
        </div>
      </div>

      <!-- Detail Layout -->
      <div class="detail-layout">
        <div>
          <!-- Synopsis -->
          <div class="detail-section">
            <h2 class="detail-section-title">Synopsis</h2>
            <p class="synopsis-text">${item.synopsis}</p>
          </div>

          <!-- Characters -->
          ${item.characters?.length ? `
          <div class="detail-section">
            <h2 class="detail-section-title">Characters</h2>
            <div class="characters-grid">
              ${item.characters.map(c => `
                <div class="char-card">
                  <img src="${c.img}" alt="${c.name}" onerror="this.src='https://placehold.co/80x80/111118/e63946?text=${c.name[0]}'">
                  <div class="char-name">${c.name}</div>
                  <div class="char-role">${c.role}</div>
                </div>
              `).join('')}
            </div>
          </div>` : ''}

          <!-- Progress -->
          ${total > 1 ? `
          <div class="detail-section">
            <h2 class="detail-section-title">My Progress</h2>
            <div class="tracker-box">
              <div style="display:flex;justify-content:space-between;margin-bottom:0.75rem">
                <span class="tracker-label">Progress: <strong id="prog-label">${prog.current} / ${total}</strong></span>
                <span class="tracker-label" style="color:var(--accent);font-weight:800">${Math.round(pct)}%</span>
              </div>
              <div class="progress-bar">
                <div class="progress-fill" id="prog-fill" style="width:${pct}%"></div>
              </div>
              <div class="tracker-input-row">
                <input type="number" class="tracker-input" id="prog-input" min="0" max="${total}" value="${prog.current}">
                <span class="tracker-label">/ ${total}</span>
                <button class="btn btn-primary" onclick="saveProgress(${item.id}, ${total})">Save</button>
              </div>
            </div>
          </div>` : ''}

          <!-- Trailer -->
          <div class="detail-section">
            <h2 class="detail-section-title">Trailer</h2>
            <div class="trailer-wrap">
              ${trailerId
                ? `<iframe src="https://www.youtube.com/embed/${trailerId}" allowfullscreen allow="autoplay"></iframe>`
                : `<div class="trailer-placeholder"><span class="big">🎬</span><span>No trailer available</span></div>`
              }
            </div>
          </div>
        </div>

        <!-- Sidebar -->
        <div>
          <!-- Info -->
          <div class="info-box">
            ${infoRows.map(([k,v]) => `
              <div class="info-row">
                <span class="info-key">${k}</span>
                <span class="info-val">${v}</span>
              </div>
            `).join('')}
          </div>

          <!-- Recommendations -->
          ${related.length ? `
          <div class="info-box">
            <h3 class="detail-section-title" style="margin-bottom:1rem;border:none;padding:0">Similar</h3>
            <div class="related-list">
              ${related.map(r => `
                <a class="related-item" href="detail.html?id=${r.id}">
                  <img src="${r.image}" alt="${r.title}" onerror="this.src='https://placehold.co/50x75/111118/e63946?text=?'">
                  <div>
                    <div class="ri-title">${r.title}</div>
                    <div class="ri-meta">${r.type} · ${r.year}</div>
                  </div>
                </a>
              `).join('')}
            </div>
          </div>` : ''}
        </div>
      </div>
    `;
  }

  function doWatchlist() {
    const added = Watchlist.toggle(item.id);
    const btn = document.getElementById('wl-btn');
    btn.textContent = added ? '♥ In My List' : '♡ Add to List';
    btn.className = `btn ${added ? 'btn-primary' : 'btn-ghost'}`;
    showToast(added ? '❤️ Added to your list' : '💔 Removed from list');
  }

  function saveProgress(id, total) {
    const val = Math.min(total, Math.max(0, parseInt(document.getElementById('prog-input').value) || 0));
    Progress.set(id, val);
    document.getElementById('prog-label').textContent = `${val} / ${total}`;
    const pct = Math.round((val / total) * 100);
    document.getElementById('prog-fill').style.width = pct + '%';
    showToast(`✅ Progress: ${pct}%`);
  }
</script>
</body>
</html>
