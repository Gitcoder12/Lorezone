services:
  db:
    image: postgres:15-alpine
    container_name: lorezone_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lorezone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      POSTGRES_DB: ${POSTGRES_DB:-lorezone}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lorezone} -d ${POSTGRES_DB:-lorezone}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: lorezone_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      DB_USER: ${POSTGRES_USER:-lorezone}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-lorezone}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      JIKAN_BASE: https://api.jikan.moe/v4
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    container_name: lorezone_web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
